<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
<meta name="color-scheme" content="light dark" />
<title>لا يوجد اتصال — معالم التربية</title>
<link rel="icon" href="/icons/icon-192.png" />
<style>
  :root { --paper: #ffffff; --ink: #111111; --muted: #737373; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0f0f0f; --ink: #f2f2f2; --muted: #8f8f8f; } }
  html[data-theme="dark"] { --paper: #0f0f0f; --ink: #f2f2f2; --muted: #8f8f8f; }
  html[data-theme="light"] { --paper: #ffffff; --ink: #111111; --muted: #737373; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; background: var(--paper); color: var(--ink); display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; margin: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { text-align: center; padding: 2rem; }
  h1 { font-size: 1.4rem; }
  p { color: var(--muted); }
  a { color: var(--ink); }
</style>
<script>(function(){try{var t=localStorage.getItem("maalem-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
</head>
<body>
<main>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تعذّر الوصول إلى منصة معالم التربية. أعد المحاولة عند عودة الاتصال.</p>
  <p><a href="/">إعادة المحاولة</a></p>
</main>
</body>
</html>
