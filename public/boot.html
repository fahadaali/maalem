#boot{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;color:#111111;animation:boot-out .45s ease 2.4s forwards}
#boot.boot-done{animation:boot-out .35s ease forwards}
@media (prefers-color-scheme:dark){#boot{background:#0f0f0f;color:#f2f2f2}}
html[data-theme="dark"] #boot{background:#0f0f0f;color:#f2f2f2}
html[data-theme="light"] #boot{background:#ffffff;color:#111111}
html[data-standalone] #boot{display:flex}
@media (display-mode:standalone){#boot{display:flex}}
@media print{#boot{display:none!important}}
.boot-mark{font-family:BootMark,Georgia,serif;font-weight:700;font-size:clamp(1.75rem,11vw,2.75rem);line-height:1.3;opacity:0;animation:boot-rise .45s cubic-bezier(.2,.7,.3,1) .03s forwards}
.boot-rule{height:2px;width:0;background:currentColor;border-radius:2px;opacity:.85;margin:.9rem 0 .75rem;animation:boot-draw .5s cubic-bezier(.2,.7,.3,1) .22s forwards}
.boot-sub{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:.82rem;color:#737373;opacity:0;animation:boot-fade .4s ease .38s forwards}
@media (prefers-color-scheme:dark){.boot-sub{color:#8f8f8f}}
html[data-theme="dark"] .boot-sub{color:#8f8f8f}
html[data-theme="light"] .boot-sub{color:#737373}
@keyframes boot-rise{from{opacity:0;transform:translateY(.7rem)}to{opacity:1;transform:none}}
@keyframes boot-draw{to{width:min(22vw,7rem)}}
@keyframes boot-fade{to{opacity:1}}
@keyframes boot-out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.boot-mark,.boot-sub{opacity:1;animation:none}.boot-rule{width:min(22vw,7rem);animation:none}}</style>
<script>(function(){try{
var t=null;try{t=localStorage.getItem("maalem-theme")}catch(e){}
if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t);
document.documentElement.style.background=t==="dark"?"#0f0f0f":"#ffffff";
var ms=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<ms.length;i++){ms[i].removeAttribute("media");ms[i].setAttribute("content",t==="dark"?"#0f0f0f":"#ffffff")}}
}catch(e){}})();</script>
</head>
<body>
<div id="boot" aria-hidden="true">
<div class="boot-mark">معالم التربية</div>
<span class="boot-rule"></span>
<div class="boot-sub">برنامج تأهيل المشرفين التربويين الجدد</div>
</div>
<script>(function(){
/* الوجهة: لوحة المستخدم كما حُفظت في آخر فتح، وإلا فمدخل المشارك — والوسيط
   يتكفّل بتحويل من كان دوره غير ذلك. ويُعلَّم أن الحركة عُرضت هنا فلا تُعاد. */
var home="/app";
try{var h=localStorage.getItem("maalem-home");if(h&&/^\/[a-z]*$/.test(h))home=h}catch(e){}
/* لحظة ظهور الشاشة هنا، تُكمل عليها صفحةُ التطبيق المدةَ نفسها فلا تنقطع الحركة */
try{sessionStorage.setItem("maalem-boot-at",String(Date.now()))}catch(e){}
/* تُترك للمتصفح فرصة رسم الشاشة قبل الانتقال، فلا يبقى السواد مكانها */
requestAnimationFrame(function(){requestAnimationFrame(function(){
setTimeout(function(){location.replace(home+"?source=pwa")},60)})});
})();</script>
</body>
</html>
